
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yasal Maç Kaynakları Testi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081525;color:#f4f7fb;font-family:Arial}
header{padding:20px;background:#10243b}
main{padding:15px;max-width:800px;margin:auto}
.panel,.source{background:#112941;border:1px solid #29445f;border-radius:12px;padding:14px;margin-bottom:12px}
button{padding:13px;border:0;border-radius:9px;background:#087b56;color:white;font-weight:bold}
a{color:#83bdf0}
.small{font-size:12px;color:#b5c5d5;line-height:1.5}
</style>
</head>
<body>
<header>
<h2>⚽ YASAL MAÇ KAYNAKLARI TESTİ</h2>
<div class="small">Beş yasal maç bülteninin erişim kontrolü</div>
</header>
<main>
<div class="panel">
<p>Otomatik erişimi kontrol etmek için aşağıdaki düğmeye bas.</p>
<button id="run">ERİŞİM TESTİNİ BAŞLAT</button>
<div id="summary">Test henüz başlamadı.</div>
</div>
<div id="sources"></div>
</main>
<script>
const sources=[
{name:"Nesine",url:"https://www.nesine.com/iddaa/futbol?code=445"},
{name:"Misli",url:"https://www.misli.com/iddaa-futbol"},
{name:"Bilyoner",url:"https://www.bilyoner.com/iddaa"},
{name:"Oley",url:"https://oley.softzen.io/iddaa/futbol/4732928"},
{name:"Birebin",url:"https://www.birebin.com/iddaa-programi-futbol"}
];

const area=document.getElementById("sources");

area.innerHTML=sources.map((s,i)=>`
<div class="source">
<h3>${s.name}</h3>
<div id="st${i}" class="small">Henüz kontrol edilmedi.</div>
<p><a href="${s.url}" target="_blank">Maç bültenini aç</a></p>
</div>`).join("");

document.getElementById("run").onclick=async()=>{
const btn=document.getElementById("run");
const summary=document.getElementById("summary");
btn.disabled=true;
let ok=0,fail=0;
summary.textContent="Kaynaklar kontrol ediliyor...";

await Promise.all(sources.map(async(s,i)=>{
const out=document.getElementById("st"+i);
out.textContent="Kontrol ediliyor...";
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),10000);
try{
const r=await fetch(s.url,{mode:"cors",credentials:"omit",signal:controller.signal});
const body=await r.text();
ok++;
out.textContent="Tarayıcı erişimi açık. HTTP "+r.status+" • "+body.length+" karakter alındı. Maç ayrıştırma henüz doğrulanmadı.";
}catch(e){
fail++;
out.textContent="Otomatik erişim doğrulanamadı. CORS, ağ engeli veya zaman aşımı.";
}
clearTimeout(timer);
}));

summary.textContent="Test bitti: "+ok+" kaynak yanıt verdi, "+fail+" kaynakta erişim doğrulanamadı. Henüz maç sayısı hesaplanmadı.";
btn.disabled=false;
};
</script>
</body>
</html>
